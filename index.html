<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yasa Agro</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6faf4;--card:#fff;--ink:#16301f;--mut:#667a6c;--line:#dfe9dc;--acc:#1f7a3f;--acc2:#e3f3e6;--warn:#d9442b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-cat="frozen"]{--acc:#1f6fae;--acc2:#e2f0fa}
:root[data-cat="pack"]{--acc:#c2500c;--acc2:#fdebdc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a13;--card:#18261c;--ink:#e8f2ea;--mut:#9bb0a0;--line:#2a3d2f;--acc:#4cbf74;--acc2:#1c3324}
:root[data-cat="frozen"]:not([data-theme="light"]){--acc:#5aaee8;--acc2:#1a2f40}
:root[data-cat="pack"]:not([data-theme="light"]){--acc:#f08a4b;--acc2:#3a2616}}
:root[data-theme="dark"]{--bg:#101a13;--card:#18261c;--ink:#e8f2ea;--mut:#9bb0a0;--line:#2a3d2f;--acc:#4cbf74;--acc2:#1c3324}
:root[data-theme="dark"][data-cat="frozen"]{--acc:#5aaee8;--acc2:#1a2f40}
:root[data-theme="dark"][data-cat="pack"]{--acc:#f08a4b;--acc2:#3a2616}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif;min-height:100vh;transition:background .3s}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{padding:18px 16px 8px;max-width:960px;margin:auto}
h1{font-size:26px;font-weight:700;color:var(--acc)}
.sub{color:var(--mut);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.tab{padding:12px 4px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:600;font-size:15px;transition:.2s}
.tab[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.search{margin-top:12px;position:relative}
.search input{width:100%;padding:14px 16px 14px 46px;border-radius:30px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.search span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px}
main{max-width:960px;margin:auto;padding:8px 16px 120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;position:relative}
.pic{height:96px;border-radius:14px;background:var(--acc2);display:grid;place-items:center;font-size:52px}
.card h3{font-size:16px;font-weight:600;margin-top:8px}
.price{color:var(--mut);font-size:13px}
.plus{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;font-size:24px;line-height:1;display:grid;place-items:center}
.card .row{padding-right:44px;min-height:40px}
.empty{padding:40px 0;text-align:center;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:520px;margin:auto;z-index:31;display:none}
.sheet.on{display:block}
.sheet h2{font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:10px 16px;border-radius:30px;background:var(--acc2);color:var(--acc);font-weight:600;border:2px solid transparent}
.chip:hover{border-color:var(--acc)}
.cust{display:flex;gap:8px;margin-top:6px}
.cust input,.f input,.f textarea{flex:1;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;width:100%}
.btn{background:var(--acc);color:#fff;border-radius:14px;padding:13px 18px;font-weight:600;font-size:16px}
.btn.full{width:100%}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.cartTab{position:fixed;right:0;top:45%;transform:translateY(-50%);background:var(--acc);color:#fff;border-radius:16px 0 0 16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25);padding-right:calc(10px + env(safe-area-inset-right,0px))}
.cartTab b{font-size:12px}
.badge{background:#fff;color:var(--acc);border-radius:20px;min-width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:14px;padding:0 6px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:41;transform:translateX(100%);transition:transform .28s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.dh h2{font-size:20px}
.x{width:36px;height:36px;border-radius:50%;background:var(--acc2);font-size:18px}
.db{flex:1;overflow:auto;padding:14px 16px}
.df{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-bottom:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.item .pic{width:60px;height:60px;font-size:32px;flex:none}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block}
.qty{display:flex;align-items:center;gap:6px;margin-top:6px}
.qty button{width:30px;height:30px;border-radius:50%;background:var(--acc2);color:var(--acc);font-size:18px;font-weight:700}
.qty input{width:62px;text-align:center;padding:5px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.del{color:var(--warn);font-size:20px;padding:6px}
.f{margin-bottom:14px}
.f label{display:block;font-weight:600;margin-bottom:6px}
.pay{display:flex;gap:10px;align-items:center;border:2px solid var(--acc);background:var(--acc2);border-radius:14px;padding:14px}
.done{text-align:center;padding:50px 10px}
.done .big{font-size:72px}
.err{color:var(--warn);font-size:14px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:auto;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -3px 16px rgba(0,0,0,.18);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:25}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:#1b2a4a;padding:2px}
.nav svg{width:26px;height:26px;fill:currentColor}
.nav button[aria-current=page]{color:#17892a}
.hrt{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:#fffd;display:grid;place-items:center;font-size:16px;color:#777}
.hrt[aria-pressed=true]{color:#e5322d}
.logo{display:block;width:min(300px,80%);height:auto;margin:0 auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{background:#f4f7f0;border-radius:14px;padding:6px}}
:root[data-theme="dark"] .logo{background:#f4f7f0;border-radius:14px;padding:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function match(x,q){const w=(x.n+' '+(K[x.id]||'')+' '+x.c).toLowerCase().replace(/[()+—]/g,' ').split(/\s+/).filter(Boolean);return q.split(/\s+/).filter(Boolean).every(t=>w.some(v=>v.includes(t)||(t.length>=4&&v.length>=4&&lev(t,v)<=(t.length>=7?2:1))))}

const ORDER_WEBHOOK='',SHOP_WA='';
function msg(o){return '🛒 নতুন অর্ডার\nনাম: '+o.name+'\nফোন: '+o.phone+'\nঠিকানা: '+o.address+'\n'+o.items.map(i=>'- '+i.name+': '+bn(i.qty)+' '+i.unit+' = ৳'+bn(i.price)).join('\n')+'\nমোট: ৳'+bn(o.total)+' (ক্যাশ অন ডেলিভারি)'}
function sendOrder(o){if(!ORDER_WEBHOOK)return;try{fetch(ORDER_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)}).catch(()=>{})}catch(e){}}
function fmt(q){return q===0.5?'½':bn(q)}

function render(){

  const q=$('q').value.trim().toLowerCase();
  const list=P.filter(x=>q?match(x,q):(cat==='wish'?wish.has(x.id):x.c===cat));
  document.querySelectorAll('.nav button').forEach(b=>{const on=b.dataset.n==='wish'?cat==='wish':b.dataset.n==='home'&&cat!=='wish';on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  $('grid').innerHTML=list.map(x=>`<div class="card"><button class="hrt" data-h="${x.id}" aria-pressed="${wish.has(x.id)}" aria-label="Wishlist ${x.n}">${wish.has(x.id)?'♥':'♡'}</button><div class="pic">${x.e}</div><div class="row"><h3>${x.n}</h3><div class="price">৳${bn(x.p)} / ${UL[x.u]}</div>${x.d?`<div class="price" style="font-size:12px">${x.d}</div>`:''}</div><button class="plus" data-id="${x.id}" aria-label="${x.n} যোগ করুন">+</button></div>`).join('');
  $('empty').hidden=list.length>0;
  $('empty').textContent=cat==='wish'&&!q?'উইশলিস্ট খালি। পছন্দের সবজির হার্ট (♡) চাপুন।':'এই নামে কোনো সবজি পাওয়া যায়নি। অন্য নাম দিয়ে খুঁজুন।';
}
$('tFresh').onclick=()=>{cat='fresh';render()};
$('tFrozen').onclick=()=>{cat='frozen';render()};
$('tPack').onclick=()=>{cat='pack';render()};
$('q').oninput=render;
$('grid').onclick=e=>{const h=e.target.closest('.hrt');if(h){const id=+h.dataset.h;wish.has(id)?wish.delete(id):wish.add(id);render();return}const b=e.target.closest('.plus');if(b)openSheet(+b.dataset.id)};

function openSheet(id){
  const x=P.find(p=>p.id===id);
  $('sheet').innerHTML=`<h2>${x.e} ${x.n}</h2><div class="price">৳${bn(x.p)} / ${UL[x.u]} — পরিমাণ বেছে নিন</div>
  <div class="chips">${OPT[x.u].map(o=>`<button class="chip" data-q="${o[0]}">${o[1]}</button>`).join('')}</div>
  <div class="price">কাস্টম অর্ডার — টাকা বা ${UL[x.u]} বেছে নিন</div>
  <div class="cust"><select id="cu" aria-label="একক" style="padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit"><option value="u">${UL[x.u]}</option><option value="tk">টাকা (৳)</option></select><input id="cq" type="number" min="0.5" step="0.5" inputmode="decimal" placeholder="যেমন: ৫" style="min-width:0"><button class="btn" id="cadd">যোগ করুন</button></div>`;
  $('sheet').onclick=e=>{const c=e.target.closest('.chip');if(c){add(id,+c.dataset.q);closeSheet()}};
  $('cu').onchange=()=>{$('cq').placeholder=$('cu').value==='tk'?'যেমন: ১০০':'যেমন: ৫'};
  $('cadd').onclick=()=>{let v=parseFloat($('cq').value);if($('cu').value==='tk')v=Math.round(v/x.p*100)/100;if(v>0){add(id,v);closeSheet()}else $('cq').focus()};
  $('ov').className='ov on';$('ov').onclick=closeSheet;$('sheet').classList.add('on');
}
function closeSheet(){$('sheet').classList.remove('on');$('ov').className='ov'}
function add(id,q){const l=cart.find(i=>i.id===id);if(l)l.q+=q;else cart.push({id,q});upd();bump()}
function bump(){const t=$('cartTab');t.animate([{transform:'translateY(-50%) scale(1.15)'},{transform:'translateY(-50%) scale(1)'}],{duration:250})}
const total=()=>cart.reduce((s,i)=>s+P.find(p=>p.id===i.id).p*i.q,0);
function upd(){
  $('cnt').textContent=bn(cart.length);$('mini').textContent='৳'+bn(Math.round(total()));
  if($('drawer').classList.contains('on')&&view==='cart')drawCart();
}

$('cartTab').onclick=()=>{view='cart';drawCart();$('drawer').classList.add('on');$('ov').className='ov on';$('ov').onclick=closeDrawer};
$('close').onclick=closeDrawer;
function closeDrawer(){$('drawer').classList.remove('on');$('ov').className='ov'}

function drawCart(){
  $('dtitle').textContent='আপনার কার্ট';
  if(!cart.length){$('db').innerHTML='<div class="empty">কার্ট খালি। পছন্দের সবজির পাশে + চাপুন।</div>';$('df').innerHTML='';return}
  $('db').innerHTML=cart.map(i=>{const x=P.find(p=>p.id===i.id);return `<div class="item"><div class="pic">${x.e}</div><div class="nm"><b>${x.n}</b><span class="price">৳${bn(Math.round(x.p*i.q))} · ${UL[x.u]}</span>
  <div class="qty"><button data-a="m" data-id="${x.id}" aria-label="কমান">−</button><input type="number" step="0.5" min="0.5" value="${i.q}" data-id="${x.id}" aria-label="পরিমাণ"><button data-a="p" data-id="${x.id}" aria-label="বাড়ান">+</button></div></div>
  <button class="del" data-a="d" data-id="${x.id}" aria-label="মুছুন">🗑️</button></div>`}).join('');
  $('df').innerHTML=`<div class="tot"><span>মোট</span><span>৳${bn(Math.round(total()))}</span></div><button class="btn full" id="confirm">অর্ডার কনফার্ম করুন</button>`;
  $('confirm').onclick=drawCheckout;
}
$('db').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const id=+b.dataset.id,x=P.find(p=>p.id===id),l=cart.find(i=>i.id===id);
  if(b.dataset.a==='d')cart=cart.filter(i=>i.id!==id);
  else if(b.dataset.a==='p')l.q+=x.u==='kg'?0.5:1;
  else{l.q-=x.u==='kg'?0.5:1;if(l.q<=0)cart=cart.filter(i=>i.id!==id)}
  upd();
};
$('db').onchange=e=>{
  if(e.target.matches('.qty input')){const id=+e.target.dataset.id,v=parseFloat(e.target.value);
    cart=v>0?cart.map(i=>i.id===id?{...i,q:v}:i):cart.filter(i=>i.id!==id);upd();drawCart()}
};

function drawCheckout(){
  view='checkout';$('dtitle').textContent='ডেলিভারির তথ্য';
  $('db').innerHTML=`<div class="f"><label for="nm">আপনার নাম</label><input id="nm" autocomplete="name"></div>
  <div class="f"><label for="ph">মোবাইল নম্বর</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel"></div>
  <div class="f"><label for="ad">ডেলিভারি ঠিকানা</label><textarea id="ad" rows="3" placeholder="বাসা/রোড/এলাকা"></textarea></div>
  <div class="f"><label>পেমেন্ট পদ্ধতি</label><div class="pay"><span style="font-size:24px">💵</span><div><b>ক্যাশ অন ডেলিভারি (COD)</b><div class="price">পণ্য হাতে পেয়ে টাকা দিন</div></div></div></div>
  <div class="err" id="err"></div>`;
  $('df').innerHTML=`<div class="tot"><span>মোট</span><span>৳${bn(Math.round(total()))}</span></div><div style="display:flex;gap:8px"><button class="btn ghost" id="back">ফিরে যান</button><button class="btn" id="place" style="flex:1">অর্ডার করুন</button></div>`;
  $('back').onclick=()=>{view='cart';drawCart()};
  $('place').onclick=()=>{
    if(!$('nm').value.trim()||$('ph').value.trim().length<6||!$('ad').value.trim()){$('err').textContent='নাম, মোবাইল নম্বর আর ঠিকানা দিন।';return}
    const t=Math.round(total());const ord={name:$('nm').value.trim(),phone:$('ph').value.trim(),address:$('ad').value.trim(),payment:'COD',total:t,time:new Date().toLocaleString('en-GB'),items:cart.map(i=>{const x=P.find(p=>p.id===i.id);return {name:x.n,qty:i.q,unit:UL[x.u],price:Math.round(x.p*i.q)}})};sendOrder(ord);orders.unshift(ord);cart=[];upd();view='done';$('dtitle').textContent='অর্ডার সম্পন্ন';
    $('db').innerHTML=`<div class="done"><div class="big">✅</div><h2 style="margin:12px 0 6px">অর্ডার হয়ে গেছে!</h2><p class="price">মোট ৳${bn(t)} · ক্যাশ অন ডেলিভারি<br>শীঘ্রই আমরা আপনাকে ফোন করব।</p></div>`;
    $('df').innerHTML=`<button class="btn full" id="ok">ঠিক আছে</button>`;$('ok').onclick=closeDrawer;
  };
}
render();
function info(h){$('sheet').innerHTML=h+'<button class="btn full" id="sx" style="margin-top:12px">বন্ধ করুন</button>';$('sheet').onclick=null;$('ov').className='ov on';$('ov').onclick=closeSheet;$('sheet').classList.add('on');$('sx').onclick=closeSheet}
function nav(n){
  if(n==='home'||n==='wish'){cat=n==='home'?'fresh':'wish';$('q').value='';render();scrollTo({top:0,behavior:'smooth'})}
  else if(n==='orders')info('<h2>আমার অর্ডার</h2>'+(orders.length?orders.map(o=>`<div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:14px"><b>${o.time}</b> · ৳${bn(o.total)}<br>${o.items.map(i=>i.name+' × '+bn(i.qty)+' '+i.unit).join(', ')}</div>`).join(''):'<p class="price" style="margin:10px 0">এই সেশনে এখনো কোনো অর্ডার নেই।</p>'));
  else if(n==='offers')info('<h2>অফার</h2><p class="price" style="margin:10px 0">এখন কোনো অফার নেই। পরে আবার দেখুন।</p>');
  else info('<h2>সাপোর্ট</h2><p class="price" style="margin:10px 0">অর্ডার নিয়ে সাহায্য লাগলে যোগাযোগ করুন।</p>'+(SHOP_WA?`<a class="btn full" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${SHOP_WA}">WhatsApp-এ মেসেজ করুন</a>`:'<p class="price">যোগাযোগের নম্বর শীঘ্রই এখানে থাকবে।</p>'));
}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)nav(b.dataset.n)};
render();
</script>
</body>
</html>
