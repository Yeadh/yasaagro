<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yasa Agro</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6faf4;--card:#fff;--ink:#16301f;--mut:#667a6c;--line:#dfe9dc;--acc:#1f7a3f;--acc2:#e3f3e6;--warn:#d9442b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-cat="frozen"]{--acc:#1f6fae;--acc2:#e2f0fa}
:root[data-cat="pack"]{--acc:#c2500c;--acc2:#fdebdc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a13;--card:#18261c;--ink:#e8f2ea;--mut:#9bb0a0;--line:#2a3d2f;--acc:#4cbf74;--acc2:#1c3324}
:root[data-cat="frozen"]:not([data-theme="light"]){--acc:#5aaee8;--acc2:#1a2f40}
:root[data-cat="pack"]:not([data-theme="light"]){--acc:#f08a4b;--acc2:#3a2616}}
:root[data-theme="dark"]{--bg:#101a13;--card:#18261c;--ink:#e8f2ea;--mut:#9bb0a0;--line:#2a3d2f;--acc:#4cbf74;--acc2:#1c3324}
:root[data-theme="dark"][data-cat="frozen"]{--acc:#5aaee8;--acc2:#1a2f40}
:root[data-theme="dark"][data-cat="pack"]{--acc:#f08a4b;--acc2:#3a2616}
*{box-sizing:border-box;margin:0}
body{background:#7ad22a;color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif;min-height:100vh;transition:background .3s}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{padding:14px max(16px,calc((100% - 960px)/2)) 6px}
h1{font-size:26px;font-weight:700;color:var(--acc)}
.sub{color:var(--mut);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.tab{padding:12px 4px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:600;font-size:15px;transition:.2s}
.tab[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.search{margin-top:12px;position:relative}
.search input{width:100%;padding:15px 16px 15px 46px;border-radius:30px;border:0;background:#0b4a1a;color:#fff;font:inherit;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.search input::placeholder{color:rgba(255,255,255,.85)}
.search span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px}
main{max-width:960px;margin:auto;padding:8px 16px 120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border:0;border-radius:22px;padding:10px;position:relative;box-shadow:0 4px 12px rgba(0,60,0,.18);color:#12361b}
.pic{height:100px;border-radius:14px;background:transparent;display:grid;place-items:center;font-size:62px}
.card h3{font-size:18px;font-weight:700;margin-top:6px;line-height:1.2;color:#12361b}
.price{color:var(--mut);font-size:13px}
.card .price{color:#4d6652}
.plus{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:#16a02e;color:#fff;font-size:28px;line-height:1;display:grid;place-items:center}
.card .row{padding-right:52px;min-height:46px}
.empty{padding:22px 12px;margin-top:10px;text-align:center;color:#12361b;background:#fffd;border-radius:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:520px;margin:auto;z-index:31;display:none}
.sheet.on{display:block}
.sheet h2{font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:10px 16px;border-radius:30px;background:var(--acc2);color:var(--acc);font-weight:600;border:2px solid transparent}
.chip:hover{border-color:var(--acc)}
.cust{display:flex;gap:8px;margin-top:6px}
.cust input,.f input,.f textarea{flex:1;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;width:100%}
.btn{background:var(--acc);color:#fff;border-radius:14px;padding:13px 18px;font-weight:600;font-size:16px}
.btn.full{width:100%}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.cartTab{position:fixed;right:0;top:45%;transform:translateY(-50%);background:var(--acc);color:#fff;border-radius:16px 0 0 16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25);padding-right:calc(10px + env(safe-area-inset-right,0px))}
.cartTab b{font-size:12px}
.badge{background:#fff;color:var(--acc);border-radius:20px;min-width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:14px;padding:0 6px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:41;transform:translateX(100%);transition:transform .28s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.dh h2{font-size:20px}
.x{width:36px;height:36px;border-radius:50%;background:var(--acc2);font-size:18px}
.db{flex:1;overflow:auto;padding:14px 16px}
.df{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-bottom:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.item .pic{width:60px;height:60px;font-size:32px;flex:none;background:var(--acc2)}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block}
.qty{display:flex;align-items:center;gap:6px;margin-top:6px}
.qty button{width:30px;height:30px;border-radius:50%;background:var(--acc2);color:var(--acc);font-size:18px;font-weight:700}
.qty input{width:62px;text-align:center;padding:5px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.del{color:var(--warn);font-size:20px;padding:6px}
.f{margin-bottom:14px}
.f label{display:block;font-weight:600;margin-bottom:6px}
.pay{display:flex;gap:10px;align-items:center;border:2px solid var(--acc);background:var(--acc2);border-radius:14px;padding:14px}
.done{text-align:center;padding:50px 10px}
.done .big{font-size:72px}
.err{color:var(--warn);font-size:14px;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:auto;background:var(--acc);transition:background .3s;border-radius:26px 26px 0 0;box-shadow:0 -3px 16px rgba(0,0,0,.18);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:25}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:#fff;padding:4px 2px;margin:0 2px;border-radius:16px}
.nav svg [stroke="#fff"]{stroke:var(--acc)}
.nav svg circle[fill="#fff"]{fill:var(--acc)}
.nav svg{width:26px;height:26px;fill:currentColor}
.nav button[aria-current=page]{background:#fff;color:var(--acc)}
.nav button[aria-current=page] svg [stroke="#fff"]{stroke:#fff}
.nav button[aria-current=page] svg circle[fill="#fff"]{fill:#fff}
.hrt{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:18px;color:#1b2a4a;box-shadow:0 1px 5px rgba(0,0,0,.18)}
.hrt[aria-pressed=true]{color:#e5322d}
.logo{display:block;width:min(340px,92%);height:auto;margin:0 auto;background:#fff;border-radius:24px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
header .tab{background:rgba(130,225,100,.6);border-color:rgba(255,255,255,.75);color:#0d4a1c}
header .tab[aria-pressed=true]{background:#fff;border-color:#fff;color:#0d4a1c;box-shadow:0 3px 10px rgba(0,0,0,.15)}

.sheet{max-height:88vh;overflow:auto}
.pic{position:relative}
.card.oos .pic{opacity:.4;filter:grayscale(1)}
.oosb{position:absolute;left:50%;top:48px;transform:translateX(-50%) rotate(-8deg);background:#e5322d;color:#fff;font-size:15px;font-weight:700;padding:3px 14px;border-radius:8px;white-space:nowrap;z-index:2}
.cartTab.has{background:#fff;color:var(--acc)}
.cartTab.has .badge{background:#ffe3e0;color:#e5322d}
.cartTab.has b{color:#e5322d}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#12361b;color:#fff;padding:10px 18px;border-radius:22px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:600;max-width:90%;text-align:center}
#toast.on{opacity:1}
.arow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.arow .nm{flex:1;min-width:0;font-weight:600;line-height:1.25}
.arow small{display:block;color:var(--mut);font-weight:400}
.ab{width:36px;height:36px;border-radius:10px;background:var(--acc2);font-size:16px;flex:none}
.tag{background:#e5322d;color:#fff;border-radius:8px;padding:0 6px;font-size:11px;font-weight:600}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg label{font-weight:600;font-size:13px;display:block}
.fg input,.fg select{width:100%;padding:9px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function match(x,q){const w=(x.n+' '+(K[x.id]||'')+' '+x.c).toLowerCase().replace(/[()+—]/g,' ').split(/\s+/).filter(Boolean);return q.split(/\s+/).filter(Boolean).every(t=>w.some(v=>v.includes(t)||(t.length>=4&&v.length>=4&&lev(t,v)<=(t.length>=7?2:1))))}

  sh(`<h2>${id?'পণ্য এডিট':'নতুন পণ্য'}</h2><div class="fg" style="margin-top:10px"><div style="grid-column:1/3"><label>নাম</label><input id="fn" value="${esc(x.n)}"></div><div><label>ইমোজি</label><input id="fe" value="${esc(x.e)}"></div><div><label>ক্যাটাগরি</label><select id="fc"><option value="fresh">ফ্রেশ</option><option value="frozen">ফ্রোজেন</option><option value="pack">প্যাকেজ</option></select></div><div><label>একক</label><select id="fu"><option value="kg">কেজি</option><option value="pc">পিস</option><option value="pk">প্যাক</option></select></div><div><label>দাম (৳)</label><input id="fp" type="number" min="0" value="${x.p}"></div><div><label>স্টক</label><input id="fs" type="number" min="0" step="0.5" value="${x.s}"></div><div style="grid-column:1/3"><label>বিবরণ (প্যাকেজের জন্য)</label><input id="fd" value="${esc(x.d||'')}"></div></div><div class="err" id="ferr"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" id="fcancel">বাতিল</button><button class="btn" id="fsave" style="flex:1">সেভ</button></div>`);
  $('fc').value=x.c;$('fu').value=x.u;
  $('fsave').onclick=()=>{const n=$('fn').value.trim(),p=parseFloat($('fp').value),s=parseFloat($('fs').value);
    if(!n||!(p>=0)||!(s>=0)){$('ferr').textContent='নাম, দাম আর স্টক ঠিকমতো দিন।';return}
    const o={n,e:$('fe').value.trim()||'🥬',c:$('fc').value,u:$('fu').value,p,s,d:$('fd').value.trim()||undefined};
    if(id)Object.assign(x,o);else P.push({id:Date.now(),h:false,...o});
    saveP();cart=cart.filter(i=>P.find(p=>p.id===i.id));upd();render();adminPanel()};
  $('fcancel').onclick=adminPanel;
}
render();
</script>
</body>
</html>
